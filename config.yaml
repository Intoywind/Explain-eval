# explain-eval 配置
# 密钥不写在这里：只写环境变量名，值放在 .env（已被 .gitignore 忽略）。

# ---- 接口 ----
providers:
  hkust:
    # HKUST GenAI API，OpenAI 兼容的 chat completions
    url: https://hkust.azure-api.net/hkust-genai/v1/chat/completions
    api_key_env: HKUST_GENAI_API_KEY   # 请求头 api-key: <密钥>
    query_params: {}                   # 网关若要求 api-version 等查询参数，写在这里
    rate_limit_per_minute: 60          # 网关限速；脚本按此控制两次请求的最小间隔
    timeout_seconds: 300
    default_params: {}                 # 发给该接口的默认参数（如 temperature、max_tokens）

  openai:
    # OpenAI 官方 API，用官方 Python SDK 的 Responses 接口
    api_key_env: OPENAI_API_KEY
    rate_limit_per_minute: null        # null = 不额外限速
    timeout_seconds: 600
    default_params:
      store: false                     # 不让 OpenAI 在服务端保存这次对话

# ---- 默认参数 ----
defaults:
  db_path: results/eval.db
  params: {}            # 对所有模型生效的生成参数；空 = 用接口自己的默认值
  retry:
    max_retries: 3      # 首次失败后最多再试 3 次
    base_wait_seconds: 5     # 第 n 次重试前等 base * 2^(n-1) 秒
    max_wait_seconds: 60

# ---- 模型 ----
# name：命令行 --model 用的名字；provider：走哪个接口；model_id：发给接口的模型名
# params：只对这个模型生效的参数，覆盖上面的默认值。参数名按接口自己的叫法：
#   openai（Responses）：temperature、max_output_tokens、reasoning: {effort: ...}
#   hkust（chat completions）：temperature、max_tokens
# price_per_1m_tokens：每百万 token 的美元价格，只用于估算费用；不填则不估算
models:
  - name: gpt-6.1-sol
    provider: openai
    model_id: gpt-6.1-sol
    params:
      reasoning: {effort: medium}   # 写死推理强度；temperature 不设，用接口默认值
    price_per_1m_tokens:   # OpenAI 标准价（2026-11 查询）；推理 token 按输出价计；未计缓存折扣，估算偏高
      input: 2.0
      output: 10.0

  - name: gpt-6-luna
    provider: openai
    model_id: gpt-6-luna
    # 2026-11-11 实测：temperature 只接受 1.0、top_p 和 seed 不支持，所以都不发；
    # 能改的只有 reasoning.effort（none/low/medium/high/xhigh）和 text.verbosity（low/medium/high），都固定为默认值 medium
    params:
      reasoning: {effort: medium}
      text: {verbosity: medium}
    price_per_1m_tokens:   # OpenAI 标准价（2026-11 查询）；缓存输入 $0.01，未计入，估算偏高
      input: 0.10
      output: 0.50

  # HKUST 模型示例（填好后去掉注释）：
  # - name: hkust-xxx
  #   provider: hkust
  #   model_id: xxx
  #   params: {}

# ---- 裁判 ----
# 字段同 models 里的一项。python -m src.judge 用这个模型给讲解逐项判断。
judge:
  name: gpt-6.1-terra
  provider: openai
  model_id: gpt-6.1-terra
  # 2026-11-11 实测：默认推理强度（medium）下 temperature 不支持（0 和 0.2 都报 400），只有 reasoning.effort=none 时才接受
  # temperature=0；seed 不支持。按“不支持温度 0 就用默认值”的约定：不发 temperature，推理强度和 verbosity 固定为默认值 medium。
  # 接口回报的实际参数（temperature 1.0、top_p 0.98 等）照常存进 judgments.params_used。
  params:
    reasoning: {effort: medium}
    text: {verbosity: medium}
  price_per_1m_tokens:   # 第三方汇总的标准价（2026-11 查询，OpenAI 价格页未直接确认）；缓存输入 $0.05，未计入
    input: 1.0
    output: 5.0
